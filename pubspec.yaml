name: petro_scan
description: "ManuScan - Identificador de minerales y rocas"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.2
  http: ^1.2.1
  shared_preferences: ^2.2.3
  tflite_flutter: ^0.12.1
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/manuscan_mineral_model.tflite
    - assets/models/labels.txt